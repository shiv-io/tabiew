name: macOS Binary

# Builds a macOS binary from any branch and uploads it as an artifact.
# Unlike Manual Release, this cuts no release and bumps no version.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target triple"
        required: true
        default: "aarch64-apple-darwin"
        type: choice
        options:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
      run_tests:
        description: "Run the test suite"
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ inputs.target }}

      - name: Cache Cargo Registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ inputs.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.target }}-cargo-

      - name: Build
        run: |
          cargo build --release --target ${{ inputs.target }}
          cp target/${{ inputs.target }}/release/tw tw-${{ inputs.target }}

      - name: Test
        if: inputs.run_tests
        run: cargo test --release --target ${{ inputs.target }}

      - name: Report Binary
        run: |
          file tw-${{ inputs.target }}
          codesign -dv tw-${{ inputs.target }} 2>&1 | head -3 || true

      - name: Upload Binary to GitHub Artifact
        uses: actions/upload-artifact@v7
        with:
          name: tw-${{ inputs.target }}-${{ github.sha }}
          path: tw-${{ inputs.target }}
          retention-days: 30
